name: Embodied AI Autonomous Radar

on:
  schedule:
    # 每天 UTC 00:00 (北京时间早上 08:00) 自动在云端苏醒运行
    - cron: '0 0 * * *'
  # 支持在 GitHub 网页上随时手动点击按钮立即运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline
        run: |
          python main.py

      - name: Deploy Updated Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html DAILY_INTELLIGENCE.md
          git commit -m "chore(auto): daily update frontier intelligence [skip ci]" || echo "No changes to commit"
          git push